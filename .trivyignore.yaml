# Trivy suppressions. Every entry MUST carry a `statement` (why) and an
# `expired_at` (when it stops being suppressed) — an entry without an expiry
# rots silently into a permanently unscanned CVE. After `expired_at` Trivy
# reports the finding again and `trivy-scan` goes red, which is the point:
# expiry forces a re-review rather than letting the suppression outlive its
# justification.
#
# Referenced by BOTH trivy-action steps in .github/workflows/ci.yml (the
# table step and the SARIF gate step) so the human-readable log reflects
# exactly what the gate enforces. The file must exist even when empty —
# trivy-action hard-fails with "cannot find ignorefile" if it is absent.
#
# The list is deliberately not a parking lot: a finding earns an entry only
# when the fix is genuinely unreachable from the pinned base image, or when it
# is a verified false positive.
#
# --- Current state (2026-10-19) -------------------------------------------
#
# One secrets entry: a FALSE POSITIVE. Trivy's `gcp-service-account` rule
# matches the literal text `"type": "service_account"` (the first field of a
# GCP key file). anthropic 1.14.0+ (bumped 1.13 -> 1.15 in #314) uses that
# exact string in docstrings for the Managed Agents `execution_identity`
# default, e.g. "sending `{"type": "service_account"}` stores the default".
# The image had 11 CRITICAL hits (.py plus the compiled .pyc copies), with no
# key material in any of them.
#
# The entry is scoped to the anthropic package only, so a real key anywhere
# else in the image (app code, another dependency) still fails the gate.
# `python*` keeps it valid across interpreter bumps. Image-scan paths need
# the leading `/`: an unanchored `app/...` matches in `trivy fs` but NOT in
# `trivy image`. Both behaviours were checked on Trivy 0.70.0 (the
# trivy-action version) against the real SDK file plus a planted key.
#
# The 13 Debian CVEs recorded here since 2026-09-18 are gone: the
# python:3.15.0-slim base (#316, Debian 13.7) ships the fixed packages.

# --- Resolved history ------------------------------------------------------
#
# CVE-2026-14456 (openssl 3.5.6-1~deb13u2 -> 3.5.7-1~deb13u2) was the red
# blocker recorded here from 2026-08-31. Resolved by the cad9a2c rebuild
# (PR #227): openssl no longer appears in the findings. It was never
# suppressed — the wait-for-rebuild path worked as intended.
#
# The previous 7 util-linux entries (CVE-2025-14104, CVE-2026-13595,
# CVE-2026-27456, CVE-2026-53612..53615) were removed on 2026-08-31: Docker
# Hub rebuilt python:3.14.7-slim (digest moved to cae66f2, landed via
# PR #215) and the rebuild shipped util-linux 2.41.5-0+deb13u1 — the fixed
# version. The suppressions no longer suppressed anything. This is the "if
# the digest moved, bump the base and DELETE this block" path, taken ahead
# of the 2026-09-24 expiry.

vulnerabilities: []

secrets:
  - id: gcp-service-account
    paths:
      - "/app/.venv/lib/python*/site-packages/anthropic/**"
    statement: >-
      False positive. anthropic SDK docstrings contain the literal
      `{"type": "service_account"}` (Managed Agents execution_identity
      default). No credential material. Scoped to the anthropic package so
      real keys elsewhere in the image still fail the scan.
    expired_at: 2027-01-19
