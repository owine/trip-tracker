# Trivy suppressions. Every entry MUST carry a `statement` (why) and an
# `expired_at` (when it stops being suppressed) — an entry without an expiry
# rots silently into a permanently unscanned CVE. After `expired_at` Trivy
# reports the finding again and `trivy-scan` goes red, which is the point:
# expiry forces a re-review rather than letting the suppression outlive its
# justification.
#
# Referenced by BOTH trivy-action steps in .github/workflows/ci.yml (the
# table step and the SARIF gate step) so the human-readable log reflects
# exactly what the gate enforces. The file must exist even when empty —
# trivy-action hard-fails with "cannot find ignorefile" if it is absent.
#
# Currently empty by design. The list is deliberately not a parking lot: a
# finding earns an entry only when the fix is genuinely unreachable from the
# pinned base image. CVE-2026-14456 (openssl 3.5.6-1~deb13u2, fixed in
# 3.5.7-1~deb13u2) is failing trivy-scan as of 2026-08-31 and is knowingly
# NOT suppressed — Docker Hub has not yet rebuilt python:3.14.7-slim against
# the patched package, and main stays red until it does rather than hiding a
# real, fixed-upstream CVE behind an expiry date.
#
# The previous 7 util-linux entries (CVE-2025-14104, CVE-2026-13595,
# CVE-2026-27456, CVE-2026-53612..53615) were removed on 2026-08-31: Docker
# Hub rebuilt python:3.14.7-slim (digest moved to
# sha256:cae66f2ef0ec51a9891263eeee7f987dacf0a9879e8aa9353d5606e0530619a5,
# landed via PR #215) and the rebuild ships util-linux 2.41.5-0+deb13u1 — the
# fixed version. The suppressions no longer suppressed anything. This is the
# "if the digest moved, bump the base and DELETE this block" path, taken
# ahead of the 2026-09-24 expiry.

