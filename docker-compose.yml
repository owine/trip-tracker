# Phase 1 compose: app + postgres only. Worker, redis, meilisearch land in their phases.
services:
  trip-tracker-app:
    image: ${TRIP_TRACKER_IMAGE:-ghcr.io/REPLACE_OWNER/trip-tracker:latest}
    restart: unless-stopped
    depends_on:
      trip-tracker-db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      OIDC_ISSUER: ${OIDC_ISSUER}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI}
      BASE_URL: ${BASE_URL}
      ADMIN_GROUP: ${ADMIN_GROUP:-trip-tracker:admin}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      TZ: ${TZ:-UTC}
      REDIS_URL: ${REDIS_URL:-redis://trip-tracker-redis:6379/0}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      MEILI_URL: ${MEILI_URL:-http://trip-tracker-search:7700}
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
      FORWARDEMAIL_RELAY_TOKEN: ${FORWARDEMAIL_RELAY_TOKEN}
    volumes:
      - trip-tracker-data:/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.trip.rule=Host(`${TRIP_HOST:-trips.example.com}`)"
      - "traefik.http.routers.trip.entrypoints=websecure"
      - "traefik.http.routers.trip.tls.certresolver=letsencrypt"
      - "traefik.http.routers.trip.middlewares=authelia@docker"
      - "traefik.http.services.trip.loadbalancer.server.port=8000"
    networks: [proxy, internal]

  trip-tracker-db:
    image: postgres:18.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: trip
      POSTGRES_DB: trip
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - trip-tracker-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trip -d trip"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  trip-tracker-redis:
    image: redis:8-alpine
    restart: unless-stopped
    networks: [internal]

  trip-tracker-search:
    image: getmeili/meilisearch:v1.51
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_ENV: production
    volumes:
      - trip-tracker-meili:/meili_data
    networks: [internal]

  trip-tracker-worker:
    image: ${TRIP_TRACKER_IMAGE:-ghcr.io/REPLACE_OWNER/trip-tracker:latest}
    restart: unless-stopped
    command: ["saq", "trip_tracker.worker.settings"]
    depends_on:
      trip-tracker-db:
        condition: service_healthy
      trip-tracker-redis:
        condition: service_started
    # Worker uses `WorkerSettings` (not full `Settings`) so it only needs
    # DB/Redis/LLM/Meili/log/documents env vars — no OIDC/session/webhook
    # since the worker doesn't serve HTTP routes that consume them.
    environment:
      DATABASE_URL: ${DATABASE_URL}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      REDIS_URL: ${REDIS_URL:-redis://trip-tracker-redis:6379/0}
      LLM_DAILY_BUDGET_CENTS: ${LLM_DAILY_BUDGET_CENTS:-100}
      LLM_MODEL: ${LLM_MODEL:-claude-haiku-4-5-20251001}
      LLM_CONFIDENCE_FLOOR: ${LLM_CONFIDENCE_FLOOR:-0.7}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      MEILI_URL: ${MEILI_URL:-http://trip-tracker-search:7700}
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
    volumes:
      - trip-tracker-data:/data
    networks: [internal]

volumes:
  trip-tracker-pg:
  trip-tracker-meili:
  trip-tracker-data:

networks:
  proxy:
    external: true
  internal:
