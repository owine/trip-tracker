{% extends "base.html" %}
{% block title %}New train · trip-tracker{% endblock %}
{% block content %}
  <h1 class="text-3xl font-semibold">New train</h1>
  {% if errors %}<p class="mt-2 text-red-600">{{ errors._form }}</p>{% endif %}
  <form method="post" action="/segments" class="mt-6 space-y-4">
    {% include "segments/_common_fields.html" %}
    <label class="block text-sm">Train number
      <input class="mt-1 w-full rounded border p-2" name="train_number"
             value="{{ values.get('train_number', '') }}">
    </label>
    <div class="grid grid-cols-2 gap-3">
      <label class="block text-sm">Origin station
        <input class="mt-1 w-full rounded border p-2" name="origin_station" required
               value="{{ values.get('origin_station', '') }}">
      </label>
      <label class="block text-sm">Destination station
        <input class="mt-1 w-full rounded border p-2" name="destination_station" required
               value="{{ values.get('destination_station', '') }}">
      </label>
    </div>
    <label class="block text-sm">Seat
      <input class="mt-1 w-full rounded border p-2" name="seat"
             value="{{ values.get('seat', '') }}">
    </label>
    <button class="rounded bg-zinc-900 px-4 py-2 text-white dark:bg-zinc-100 dark:text-zinc-900">Create</button>
  </form>
{% endblock %}
