name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write
  pull-requests: read      # gitleaks/semgrep enumerate PR commits
  actions: read            # semgrep reads workflow-runs API

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39  # v3.2.4
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install 3.14
      - name: Sync deps
        run: uv sync --all-groups --frozen
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format
        run: uv run ruff format --check .
      - name: djlint
        run: uv run djlint src/trip_tracker/templates --check

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39  # v3.2.4
        with: { enable-cache: true }
      - run: uv python install 3.14
      - run: uv sync --all-groups --frozen
      - run: uv run mypy

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39  # v3.2.4
        with: { enable-cache: true }
      - run: uv python install 3.14
      - run: uv sync --all-groups --frozen
      - name: Install postgres client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client postgresql
      - name: Build Tailwind CSS (required for static mount)
        run: bash scripts/build-tailwind.sh
      - name: Run tests with coverage
        run: uv run pytest --cov --cov-report=xml --cov-report=term
      - uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238  # v4.6.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  security-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39  # v3.2.4
        with: { enable-cache: true }
      - run: uv python install 3.14
      - run: uv sync --all-groups --frozen
      - name: bandit
        run: uv run bandit -c pyproject.toml -r src/
      - name: pip-audit
        # Skip our own editable trip-tracker dist (not on PyPI). No --strict so
        # pip-audit doesn't count the skip as an error.
        run: uv run pip-audit --skip-editable

  security-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  security-semgrep:
    runs-on: ubuntu-latest
    container: returntocorp/semgrep
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - run: semgrep ci --config p/owasp-top-ten --config p/python --sarif --output semgrep.sarif
        env:
          SEMGREP_RULES: p/owasp-top-ten p/python
      - uses: github/codeql-action/upload-sarif@ce64ddcb0d8d890d2df4a9d1c04ff297367dea2a  # v3.35.2
        # SARIF upload requires GHAS on private repos; tolerate failure.
        if: always()
        continue-on-error: true
        with:
          sarif_file: semgrep.sarif

  docker-build-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0
      - name: Build image (load locally, no push)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
        with:
          context: .
          load: true
          tags: trip-tracker:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: trip-tracker:ci
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - uses: github/codeql-action/upload-sarif@ce64ddcb0d8d890d2df4a9d1c04ff297367dea2a  # v3.35.2
        # SARIF upload requires GHAS on private repos; tolerate failure.
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy.sarif
