name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write
  pull-requests: read      # gitleaks/semgrep enumerate PR commits
  actions: read            # semgrep reads workflow-runs API
  packages: write          # docker-build/manifest-merge push to GHCR (main push only)
  id-token: write          # cosign keyless signing (main push only)
  attestations: write      # buildx provenance/sbom attestations (main push only)

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install 3.14
      - name: Sync deps
        run: uv sync --all-groups --frozen
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format
        run: uv run ruff format --check .
      - name: djlint
        run: uv run djlint src/trip_tracker/templates --check

  typecheck:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with: { enable-cache: true }
      - run: uv python install 3.14
      - run: uv sync --all-groups --frozen
      - run: uv run mypy

  test:
    runs-on: ubuntu-26.04
    services:
      postgres:
        image: postgres:18.6-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with: { enable-cache: true }
      - run: uv python install 3.14
      - run: uv sync --all-groups --frozen
      - name: Put postgres server binaries on PATH
        run: |
          # ubuntu-26.04 ships PostgreSQL 18 from PGDG already, but Ubuntu keeps
          # the server binaries (initdb/pg_ctl) off $PATH by convention.
          # pytest-postgresql spawns its own ephemeral cluster and needs them.
          echo "::notice::pg_config --bindir = $(pg_config --bindir)"
          ls -l "$(pg_config --bindir)/initdb" "$(pg_config --bindir)/pg_ctl"
          pg_config --bindir >> "$GITHUB_PATH"
      - name: Build Tailwind CSS (required for static mount)
        run: bash scripts/build-tailwind.sh
      - name: Run tests with coverage
        run: uv run pytest --cov --cov-report=xml --cov-report=term
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  security-python:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with: { enable-cache: true }
      - run: uv python install 3.14
      - run: uv sync --all-groups --frozen
      - name: bandit
        run: uv run bandit -c pyproject.toml -r src/
      - name: pip-audit
        # Skip our own editable trip-tracker dist (not on PyPI). No --strict so
        # pip-audit doesn't count the skip as an error.
        run: uv run pip-audit --skip-editable

  security-secrets:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  security-semgrep:
    runs-on: ubuntu-26.04
    container: returntocorp/semgrep@sha256:34ab619bf1391a24bfda3f05debd0d8a6ce3093c2d5f9d39cfc00f83c1397823
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # Two p/python supply-chain rules are excluded here — both protections
      # exist, but semgrep can't observe them by statically scanning this repo:
      #   - renovate-missing-minimum-release-age: the soak policy (3 days; 7 days
      #     for majors) is set in the owine/renovate-config preset, which the rule
      #     can't resolve through `extends`.
      #   - uv-missing-dependency-cooldown: uv's exclude-newer would reject a
      #     version Renovate bumps to inside its 3-day soak, breaking Renovate
      #     PRs — the cooldown is enforced by Renovate, not uv.
      - run: >-
          semgrep ci --config p/owasp-top-ten --config p/python
          --exclude-rule package_managers.renovate.renovate-missing-minimum-release-age.renovate-missing-minimum-release-age
          --exclude-rule package_managers.uv.uv-missing-dependency-cooldown.uv-missing-dependency-cooldown
          --sarif --output semgrep.sarif
        env:
          SEMGREP_RULES: p/owasp-top-ten p/python
      - uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63  # v4.38.0
        if: always()
        with:
          sarif_file: semgrep.sarif

  # Detect whether image-relevant files changed (PR-only) and compute the
  # docker-build matrix:
  #   - push to main: build both amd64 and arm64 (full release pipeline)
  #   - pull_request: build amd64 only (validation; arm64 caught post-merge)
  # Always runs so its outputs are available to docker-build's strategy.
  detect-changes:
    runs-on: ubuntu-26.04
    outputs:
      image: ${{ steps.filter.outputs.image }}
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - if: github.event_name == 'pull_request'
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        with:
          filters: |
            image:
              - 'Dockerfile'
              - '.dockerignore'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'src/**'
              - 'migrations/**'
              - 'alembic.ini'
              - 'scripts/build-tailwind.sh'
              - 'README.md'
              - '.github/workflows/ci.yml'
      - id: set-matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # The built-in github-actions manager still can't see these
          # `runner` values: both echo lines build a quoted JSON string inside
          # a `run:` step, not parsed YAML. They ARE tracked anyway — the
          # shared renovate-config preset (owine/renovate-config#103) adds a
          # customManager pattern for exactly this shape, capturing with the
          # same shape as the built-in manager, so they land in the same PR as
          # the literal `runs-on:` labels above. Do NOT hand-bump them.
          #
          # The tracking depends on the SHAPE: the regex matches
          # `"runner":"<os>-<version>"` with the version's first character a
          # digit and any suffix kept attached (`26.04-arm` is its own
          # datasource version, not `26.04` decorated). Renaming the JSON key,
          # building the string from variables, or reformatting it across
          # lines un-tracks it silently — nothing errors anywhere.
          if [ "$EVENT_NAME" = "push" ]; then
            echo 'matrix=[{"platform":"linux/amd64","runner":"ubuntu-26.04","arch":"amd64"},{"platform":"linux/arm64","runner":"ubuntu-26.04-arm","arch":"arm64"}]' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix=[{"platform":"linux/amd64","runner":"ubuntu-26.04","arch":"amd64"}]' >> "$GITHUB_OUTPUT"
          fi

  # Per-arch native image builds.
  # - main push: full pipeline — both arches, push-by-digest to GHCR, provenance
  #   + sbom + cosign signing + Trivy scan via downstream jobs.
  # - pull_request: validation-only — single-arch (amd64 via detect-changes
  #   matrix), push=false, skip provenance/sbom for speed. Catches Dockerfile
  #   breakage before merge. Gated by paths-filter so docs/test-only PRs skip
  #   the build entirely.
  #
  # Gated on ALL code-quality + security jobs so a failing lint, typecheck,
  # test, or security scan blocks image push.
  docker-build-matrix:
    needs: [lint, typecheck, test, security-python, security-secrets, security-semgrep, detect-changes]
    if: |
      !cancelled() &&
      needs.lint.result == 'success' &&
      needs.typecheck.result == 'success' &&
      needs.test.result == 'success' &&
      needs.security-python.result == 'success' &&
      needs.security-secrets.result == 'success' &&
      needs.security-semgrep.result == 'success' &&
      needs.detect-changes.result == 'success' &&
      (github.event_name == 'push' || needs.detect-changes.outputs.image == 'true')
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      # Login only needed for push (main). PRs build with push=false; the gha
      # cache backend doesn't need GHCR credentials.
      - if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}

      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          # GIT_SHA bakes the commit identifier into the image's final ENV layer
          # so /healthz and the page footer can report which commit is running.
          # VERSION is github.ref_name: a semver tag like "v0.8.1" on tagged
          # releases, or the branch name (e.g. "main") on branch pushes — same
          # source the org.opencontainers.image.version label uses.
          build-args: |
            GIT_SHA=${{ github.sha }}
            VERSION=${{ github.ref_name }}
          # push=true on main, push=false on PRs (validation only).
          # push-by-digest is only meaningful when actually pushing; harmless otherwise.
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=${{ github.event_name == 'push' }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          # PRs READ main's cache but don't WRITE — avoids polluting main's
          # cache scope with PR-only state.
          cache-to: ${{ github.event_name == 'push' && format('type=gha,mode=max,scope={0}', matrix.arch) || '' }}
          # Provenance + SBOM are slow and only meaningful for published images.
          provenance: ${{ github.event_name == 'push' }}
          sbom: ${{ github.event_name == 'push' }}

      # Digest export + upload feed manifest-merge, which only runs on main push.
      - if: github.event_name == 'push'
        name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - if: github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Stable-named aggregator so the branch ruleset can require a single
  # `docker-build` check regardless of the matrix dimensions (platform/runner/
  # arch — `ubuntu-26.04` rotates when Renovate bumps runner images).
  # Treats "skipped" as success: doc-only PRs intentionally skip the matrix via
  # detect-changes, and the aggregator must not block those merges.
  docker-build:
    needs: docker-build-matrix
    if: always()
    runs-on: ubuntu-26.04
    steps:
      - name: Verify matrix succeeded or was skipped
        env:
          MATRIX_RESULT: ${{ needs.docker-build-matrix.result }}
        run: |
          case "$MATRIX_RESULT" in
            success|skipped) exit 0 ;;
            *) echo "docker-build-matrix result: $MATRIX_RESULT" ; exit 1 ;;
          esac

  # Merge per-arch digests into a multi-arch manifest list and sign it.
  # Only runs on main push (depends on docker-build-matrix which is also gated).
  manifest-merge:
    if: github.event_name == 'push'
    needs: docker-build-matrix
    runs-on: ubuntu-26.04
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          # Tag-less release model: every push to main produces a fresh image.
          # `:latest` and `:main` both float to current main HEAD; `:sha-<long>`
          # is the immutable per-commit pin for rollback.
          # `org.opencontainers.image.version` label auto-populates from the
          # matched tag pattern — currently "main" (branch name fallback), but
          # will become the semver value once we cut tagged releases again.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,format=long

      - name: Assemble multi-arch manifest list and push
        working-directory: /tmp/digests
        run: |
          # shellcheck disable=SC2046  # intentional word-splitting: jq and
          # printf each emit multiple shell args (one per tag, one per digest).
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ github.repository }}@sha256:%s ' *)

      - id: digest
        name: Resolve merged manifest list digest
        run: |
          digest=$(docker buildx imagetools inspect "ghcr.io/${{ github.repository }}:latest" --format '{{json .Manifest.Digest}}' | jq -r .)
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Cosign sign the multi-arch manifest (keyless OIDC)
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          cosign sign --yes "ghcr.io/${{ github.repository }}@${DIGEST}"

  # Trivy CVE scan against the just-published manifest digest. Only on main
  # push. Scanning by digest (not local build) means we scan exactly what got
  # published — no chance of drift between scanned and deployed image.
  # Requires docker login first because the GHCR package is private; Trivy's
  # remote-pull resolver needs credentials to fetch the image.
  trivy-scan:
    if: github.event_name == 'push'
    needs: manifest-merge
    runs-on: ubuntu-26.04
    steps:
      # Needed only for .trivyignore.yaml — this job scans a published digest,
      # not the working tree, so without a checkout the ignore file would be
      # absent and trivy-action would hard-fail ("cannot find ignorefile").
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Human-readable findings in the job log. Keep `severity` and
      # `ignore-unfixed` identical to the SARIF gate step below so the table
      # reflects exactly what the gate enforces; only `format` and `exit-code`
      # differ (table + exit-code 0 here so this step reports without ever
      # failing the job — the sarif step is the gate). Without this, a gate
      # failure shows no CVE details in the log, only in the Security tab.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}@${{ needs.manifest-merge.outputs.digest }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: "0"
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}@${{ needs.manifest-merge.outputs.digest }}
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
      - uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63  # v4.38.0
        if: always()
        with:
          sarif_file: trivy.sarif
