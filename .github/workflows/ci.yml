name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write
  pull-requests: read      # gitleaks/semgrep enumerate PR commits
  actions: read            # semgrep reads workflow-runs API
  packages: write          # docker-build/manifest-merge push to GHCR (main push only)
  id-token: write          # cosign keyless signing (main push only)
  attestations: write      # buildx provenance/sbom attestations (main push only)

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install 3.14
      - name: Sync deps
        run: uv sync --all-groups --frozen
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format
        run: uv run ruff format --check .
      - name: djlint
        run: uv run djlint src/trip_tracker/templates --check

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with: { enable-cache: true }
      - run: uv python install 3.14
      - run: uv sync --all-groups --frozen
      - run: uv run mypy

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4-alpine@sha256:96d56f7f57c6aacd1fcb908bc83b345ec5f83231ee486dd66a1baadce274db88
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with: { enable-cache: true }
      - run: uv python install 3.14
      - run: uv sync --all-groups --frozen
      - name: Install postgres 18 client tools (PGDG)
        run: |
          # Ubuntu Noble's default repo ships postgresql-client 16, which can't
          # pg_dump from the PG 18 service container. Pull 18 from PGDG.
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          # postgresql-18 (server) is required by pytest-postgresql, which
          # spawns its own ephemeral cluster via pg_ctl/initdb for unit tests.
          sudo apt-get install -y postgresql-client-18 postgresql-18
      - name: Build Tailwind CSS (required for static mount)
        run: bash scripts/build-tailwind.sh
      - name: Run tests with coverage
        run: uv run pytest --cov --cov-report=xml --cov-report=term
      - uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354  # v6.0.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  security-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with: { enable-cache: true }
      - run: uv python install 3.14
      - run: uv sync --all-groups --frozen
      - name: bandit
        run: uv run bandit -c pyproject.toml -r src/
      - name: pip-audit
        # Skip our own editable trip-tracker dist (not on PyPI). No --strict so
        # pip-audit doesn't count the skip as an error.
        run: uv run pip-audit --skip-editable

  security-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  security-semgrep:
    runs-on: ubuntu-latest
    container: returntocorp/semgrep@sha256:9349edbadf90c3f3c0c3f55867625354e89680e6fa10d9034042af52fdb0e0d0
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - run: semgrep ci --config p/owasp-top-ten --config p/python --sarif --output semgrep.sarif
        env:
          SEMGREP_RULES: p/owasp-top-ten p/python
      - uses: github/codeql-action/upload-sarif@7211b7c8077ea37d8641b6271f6a365a22a5fbfa  # v4.36.0
        if: always()
        with:
          sarif_file: semgrep.sarif

  # Detect whether image-relevant files changed (PR-only) and compute the
  # docker-build matrix:
  #   - push to main: build both amd64 and arm64 (full release pipeline)
  #   - pull_request: build amd64 only (validation; arm64 caught post-merge)
  # Always runs so its outputs are available to docker-build's strategy.
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.filter.outputs.image }}
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - if: github.event_name == 'pull_request'
        id: filter
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d  # v4.0.1
        with:
          filters: |
            image:
              - 'Dockerfile'
              - '.dockerignore'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'src/**'
              - 'migrations/**'
              - 'alembic.ini'
              - 'scripts/build-tailwind.sh'
              - 'README.md'
              - '.github/workflows/ci.yml'
      - id: set-matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            echo 'matrix=[{"platform":"linux/amd64","runner":"ubuntu-24.04","arch":"amd64"},{"platform":"linux/arm64","runner":"ubuntu-24.04-arm","arch":"arm64"}]' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix=[{"platform":"linux/amd64","runner":"ubuntu-24.04","arch":"amd64"}]' >> "$GITHUB_OUTPUT"
          fi

  # Per-arch native image builds.
  # - main push: full pipeline — both arches, push-by-digest to GHCR, provenance
  #   + sbom + cosign signing + Trivy scan via downstream jobs.
  # - pull_request: validation-only — single-arch (amd64 via detect-changes
  #   matrix), push=false, skip provenance/sbom for speed. Catches Dockerfile
  #   breakage before merge. Gated by paths-filter so docs/test-only PRs skip
  #   the build entirely.
  #
  # Gated on ALL code-quality + security jobs so a failing lint, typecheck,
  # test, or security scan blocks image push.
  docker-build:
    needs: [lint, typecheck, test, security-python, security-secrets, security-semgrep, detect-changes]
    if: |
      !cancelled() &&
      needs.lint.result == 'success' &&
      needs.typecheck.result == 'success' &&
      needs.test.result == 'success' &&
      needs.security-python.result == 'success' &&
      needs.security-secrets.result == 'success' &&
      needs.security-semgrep.result == 'success' &&
      needs.detect-changes.result == 'success' &&
      (github.event_name == 'push' || needs.detect-changes.outputs.image == 'true')
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v4.1.0

      # Login only needed for push (main). PRs build with push=false; the gha
      # cache backend doesn't need GHCR credentials.
      - if: github.event_name == 'push'
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9  # v6.1.0
        with:
          images: ghcr.io/${{ github.repository }}

      - id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf  # v7.2.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          # GIT_SHA bakes the commit identifier into the image's final ENV layer
          # so /healthz and the page footer can report which commit is running.
          # VERSION is github.ref_name: a semver tag like "v0.8.1" on tagged
          # releases, or the branch name (e.g. "main") on branch pushes — same
          # source the org.opencontainers.image.version label uses.
          build-args: |
            GIT_SHA=${{ github.sha }}
            VERSION=${{ github.ref_name }}
          # push=true on main, push=false on PRs (validation only).
          # push-by-digest is only meaningful when actually pushing; harmless otherwise.
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=${{ github.event_name == 'push' }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          # PRs READ main's cache but don't WRITE — avoids polluting main's
          # cache scope with PR-only state.
          cache-to: ${{ github.event_name == 'push' && format('type=gha,mode=max,scope={0}', matrix.arch) || '' }}
          # Provenance + SBOM are slow and only meaningful for published images.
          provenance: ${{ github.event_name == 'push' }}
          sbom: ${{ github.event_name == 'push' }}

      # Digest export + upload feed manifest-merge, which only runs on main push.
      - if: github.event_name == 'push'
        name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - if: github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Merge per-arch digests into a multi-arch manifest list and sign it.
  # Only runs on main push (depends on docker-build which is also gated).
  manifest-merge:
    if: github.event_name == 'push'
    needs: docker-build
    runs-on: ubuntu-24.04
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v4.1.0

      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9  # v6.1.0
        with:
          images: ghcr.io/${{ github.repository }}
          # Tag-less release model: every push to main produces a fresh image.
          # `:latest` and `:main` both float to current main HEAD; `:sha-<long>`
          # is the immutable per-commit pin for rollback.
          # `org.opencontainers.image.version` label auto-populates from the
          # matched tag pattern — currently "main" (branch name fallback), but
          # will become the semver value once we cut tagged releases again.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,format=long

      - name: Assemble multi-arch manifest list and push
        working-directory: /tmp/digests
        run: |
          # shellcheck disable=SC2046  # intentional word-splitting: jq and
          # printf each emit multiple shell args (one per tag, one per digest).
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ github.repository }}@sha256:%s ' *)

      - id: digest
        name: Resolve merged manifest list digest
        run: |
          digest=$(docker buildx imagetools inspect "ghcr.io/${{ github.repository }}:latest" --format '{{json .Manifest.Digest}}' | jq -r .)
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Cosign sign the multi-arch manifest (keyless OIDC)
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          cosign sign --yes "ghcr.io/${{ github.repository }}@${DIGEST}"

  # Trivy CVE scan against the just-published manifest digest. Only on main
  # push. Scanning by digest (not local build) means we scan exactly what got
  # published — no chance of drift between scanned and deployed image.
  # Requires docker login first because the GHCR package is private; Trivy's
  # remote-pull resolver needs credentials to fetch the image.
  trivy-scan:
    if: github.event_name == 'push'
    needs: manifest-merge
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}@${{ needs.manifest-merge.outputs.digest }}
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - uses: github/codeql-action/upload-sarif@7211b7c8077ea37d8641b6271f6a365a22a5fbfa  # v4.36.0
        if: always()
        with:
          sarif_file: trivy.sarif
