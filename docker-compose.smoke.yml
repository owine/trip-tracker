# Alt-port override for smoke (host 5432/6379 already in use).
# Layer on top of docker-compose.yml + docker-compose.dev.yml.
# Uses !override to REPLACE the dev override's port mapping rather than merge.
services:
  trip-tracker-db:
    environment:
      PGDATA: /var/lib/postgresql/data
    ports: !override
      - "5433:5432"
  trip-tracker-redis:
    ports: !override
      - "6380:6379"
