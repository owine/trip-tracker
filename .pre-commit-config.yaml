repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        # Compose uses non-standard YAML tags like `!override` for list-replacement.
        args: ["--unsafe"]
      - id: check-added-large-files
        args: ["--maxkb=500"]
        exclude: ^src/trip_tracker/static/data/cities1000\.tsv$
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.22
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.0
    hooks:
      - id: mypy
        additional_dependencies:
          - "pydantic>=2.9"
          - "pydantic-settings>=2.6"
          - "sqlalchemy>=2.0"
          - "fastapi>=0.115"
          - "httpx>=0.27"
          - "structlog>=24.4"
          - "itsdangerous>=2.2"
          - "authlib>=1.3.2"
          - "types-passlib"
          - "anthropic>=0.97,<0.98"
          - "saq[hiredis]>=0.26"
        files: ^src/

  - repo: https://github.com/Riverside-Healthcare/djLint
    rev: v1.40.8
    hooks:
      - id: djlint-reformat
        args: [--profile=jinja]
        files: ^src/trip_tracker/templates/

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/gitguardian/ggshield
    rev: v1.52.2
    hooks:
      - id: ggshield
        language_version: python3
        stages: [pre-commit]
