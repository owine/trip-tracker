repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        # Compose uses non-standard YAML tags like `!override` for list-replacement.
        args: ["--unsafe"]
      - id: check-added-large-files
        args: ["--maxkb=500"]
        exclude: ^src/trip_tracker/static/data/cities1000\.tsv$
      - id: check-merge-conflict
      - id: detect-private-key

  # Lint/type tooling runs the project venv's own binaries via `uv run`, so the
  # hook version is always exactly the pyproject.toml pin — no separate rev to
  # drift (previously the mirror revs skewed from the pep621 pins). mypy checks
  # against the venv's real installed deps, replacing a hand-maintained
  # additional_dependencies list. Requires `uv sync` before running hooks.
  - repo: local
    hooks:
      - id: ruff
        name: ruff (uv run)
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff-format (uv run)
        entry: uv run ruff format
        language: system
        # markdown included: ruff >=0.16 formats python code blocks in docs,
        # and CI's `ruff format --check .` covers them. `ruff check` does not
        # lint markdown, so the lint hook above stays python-only.
        types_or: [python, pyi, markdown]
        require_serial: true
      - id: mypy
        name: mypy (uv run)
        entry: uv run mypy
        language: system
        types_or: [python, pyi]
        files: ^src/
        require_serial: true
      - id: djlint
        name: djlint (uv run)
        entry: uv run djlint --profile=jinja --reformat
        language: system
        files: ^src/trip_tracker/templates/
        require_serial: true

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/gitguardian/ggshield
    rev: v1.52.2
    hooks:
      - id: ggshield
        language_version: python3
        stages: [pre-commit]
