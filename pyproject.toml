[project]
name = "trip-tracker"
version = "0.1.0"
description = "Self-hosted itinerary aggregator (TripIt replacement)."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.136.1",
    "uvicorn[standard]>=0.46.0",
    "jinja2>=3.1.6",
    "pydantic>=2.13.3",
    "pydantic-settings>=2.14.0",
    "sqlalchemy[asyncio]>=2.0.49",
    "asyncpg>=0.31.0",
    "alembic>=1.18.4",
    "authlib>=1.7.0",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "structlog>=25.5.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "pytest-postgresql>=8.0.0",
    "psycopg[binary]>=3.3.3",          # used by pytest-postgresql
    "respx>=0.23.1",                   # mock httpx
    "ruff>=0.15.12",
    "mypy>=1.20.2",
    "types-passlib>=1.7.7.20260211",
    "pre-commit>=4.6.0",
    "djlint>=1.36.4",
    "bandit[toml]>=1.9.4",
    "pip-audit>=2.10.0",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trip_tracker"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",          # pycodestyle + pyflakes
    "I",                    # isort
    "UP",                   # pyupgrade
    "B",                    # bugbear
    "C4",                   # comprehensions
    "SIM",                  # simplify
    "RUF",                  # ruff-specific
    "ASYNC",                # async correctness
    "S",                    # bandit-lite
    "PT",                   # pytest style
    "RET", "ARG", "PIE",
]
ignore = ["S101"]           # allow `assert` in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "ARG", "PT011"]
"migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
warn_redundant_casts = true
plugins = ["pydantic.mypy"]
files = ["src"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["authlib.*", "pytest_postgresql.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:passlib.*",
    "ignore::DeprecationWarning:authlib.*",
]

[tool.coverage.run]
source = ["src/trip_tracker"]
branch = true
omit = ["src/trip_tracker/__main__.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = false
exclude_also = [
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.bandit]
exclude_dirs = ["tests", "migrations"]

[tool.djlint]
profile = "jinja"
indent = 2
