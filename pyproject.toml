[project]
name = "trip-tracker"
version = "0.1.0"
description = "Self-hosted itinerary aggregator (TripIt replacement)."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "authlib>=1.3.2",
    "httpx>=0.27",
    "itsdangerous>=2.2",
    "structlog>=24.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "pytest-postgresql>=6.1",
    "psycopg[binary]>=3.2",            # used by pytest-postgresql
    "respx>=0.21",                     # mock httpx
    "ruff>=0.7",
    "mypy>=1.13",
    "types-passlib",
    "pre-commit>=4.0",
    "djlint>=1.36",
    "bandit[toml]>=1.7",
    "pip-audit>=2.7",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trip_tracker"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",          # pycodestyle + pyflakes
    "I",                    # isort
    "UP",                   # pyupgrade
    "B",                    # bugbear
    "C4",                   # comprehensions
    "SIM",                  # simplify
    "RUF",                  # ruff-specific
    "ASYNC",                # async correctness
    "S",                    # bandit-lite
    "PT",                   # pytest style
    "RET", "ARG", "PIE",
]
ignore = ["S101"]           # allow `assert` in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "ARG", "PT011"]
"migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
warn_redundant_casts = true
plugins = ["pydantic.mypy"]
files = ["src"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["authlib.*", "pytest_postgresql.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:passlib.*",
    "ignore::DeprecationWarning:authlib.*",
]

[tool.coverage.run]
source = ["src/trip_tracker"]
branch = true
omit = ["src/trip_tracker/__main__.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = false
exclude_also = [
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.bandit]
exclude_dirs = ["tests", "migrations"]

[tool.djlint]
profile = "jinja"
indent = 2
