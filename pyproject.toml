[project]
name = "trip-tracker"
version = "0.8.1"
description = "Self-hosted itinerary aggregator (TripIt replacement)."
readme = "README.md"
requires-python = "==3.14.7"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.3",
    "jinja2==3.1.6",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "sqlalchemy[asyncio]==2.0.52",
    "asyncpg==0.31.0",
    "alembic==1.19.1",
    "authlib==1.7.2",
    "httpx==0.28.1",
    "itsdangerous==2.2.0",
    "structlog==26.1.0",
    "python-multipart==0.0.32",
    "anthropic==0.121.0",
    "redis==8.1.0",
    "extruct==0.18.0",
    "saq[hiredis]==0.26.4",
    "meilisearch-python-sdk==7.4.1",
    "pdfplumber==0.11.10",
    "joserfc==1.7.4",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "pytest-postgresql==8.1.0",
    "psycopg[binary]==3.3.4",          # used by pytest-postgresql
    "respx==0.23.1",                   # mock httpx
    "ruff==0.16.3",
    "mypy==2.3.0",
    "types-passlib==1.7.7.20260211",
    "pre-commit==4.6.2",
    "djlint==1.44.2",
    "bandit[toml]==1.9.4",
    "pip-audit==2.10.1",
    "icalendar==7.2.2",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trip_tracker"]

[tool.ruff]
line-length = 100
target-version = "py313"  # ruff doesn't yet recognize py314; py313 is a safe subset
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",          # pycodestyle + pyflakes
    "I",                    # isort
    "UP",                   # pyupgrade
    "B",                    # bugbear
    "C4",                   # comprehensions
    "SIM",                  # simplify
    "RUF",                  # ruff-specific
    "ASYNC",                # async correctness
    "S",                    # bandit-lite
    "PT",                   # pytest style
    "RET", "ARG", "PIE",
]
ignore = ["S101"]           # allow `assert` in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "ARG", "PT011"]
"migrations/**" = ["E501"]
"src/trip_tracker/search/client.py" = ["SIM105", "S110"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
warn_redundant_casts = true
plugins = ["pydantic.mypy"]
files = ["src"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["authlib.*", "pytest_postgresql.*", "extruct"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config -m 'not live_llm'"
markers = [
    "live_llm: requires real ANTHROPIC_API_KEY; not run in CI",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:passlib.*",
    "ignore::DeprecationWarning:authlib.*",
    "ignore::DeprecationWarning:mf2py.*",
]

[tool.coverage.run]
source = ["src/trip_tracker"]
branch = true
omit = ["src/trip_tracker/__main__.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = false
exclude_also = [
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.bandit]
exclude_dirs = ["tests", "migrations"]

[tool.djlint]
profile = "jinja"
indent = 2
